[theme]
base = "dark"
primaryColor = "#c97753"
backgroundColor = "#0b0e12"
secondaryBackgroundColor = "#11161c"
textColor = "#ece8df"
linkColor = "#d99577"
borderColor = "#222b36"
showWidgetBorder = true
baseRadius = "3px"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap, serif"
headingFontWeights = 400
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"
chartCategoricalColors = ["#c46a46", "#3790b8", "#a8843a", "#8d949d"]

[server]
address = "localhost"
port = 8501
headless = true
maxUploadSize = 20
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
