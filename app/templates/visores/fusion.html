
<link rel="stylesheet" href="__FUENTES__">
<div id="fusion">
  <div class="lienzo"><svg id="svg" viewBox="0 0 1160 470" role="img"
    aria-label="Fusión tardía: la CNN y cuatro variables clínicas se estandarizan, se ponderan en una regresión logística y dan la probabilidad de pCR y su perfil"></svg></div>
  <div id="tip"></div>
  <div id="mandos">
    <div class="grupo"><span class="et">paciente de ejemplo</span><div id="ejemplos"></div></div>
    <div class="grupo deslizadores">
      <label>p de imagen<input id="p" type="range" min="0.30" max="0.70" step="0.005"><output id="p_o"></output></label>
      <label>edad<input id="edad" type="range" min="25" max="80" step="1"><output id="edad_o"></output></label>
      <label>volumen<input id="vol" type="range" min="1" max="150" step="1"><output id="vol_o"></output></label>
    </div>
    <div class="grupo"><span class="et">receptores</span>
      <div class="par"><span>HR</span><button data-k="HR" data-v="0">−</button><button data-k="HR" data-v="1">+</button></div>
      <div class="par"><span>HER2</span><button data-k="HER2" data-v="0">−</button><button data-k="HER2" data-v="1">+</button></div>
    </div>
  </div>
</div>
<style>
:root{--l:#1d252f;--l2:#2a3440;--t:#ece8df;--t2:#a9afb7;--te:#6b7480;--r:#c97753;--c:#5a9ec4}
html,body{margin:0;background:transparent;color:var(--t);font-family:Geist,system-ui,sans-serif}
#fusion{position:relative;height:__ALTO__px;border:1px solid var(--l);border-radius:2px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(70% 80% at 55% 40%,#10161d 0%,#0b0e12 75%)}
#fusion::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(236,232,223,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(236,232,223,.03) 1px,transparent 1px);background-size:28px 28px}
.lienzo{position:relative;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden}
svg{display:block;width:100%;height:100%;min-width:860px}
text{font-family:Geist,system-ui,sans-serif;fill:var(--t)}
.mono{font-family:'Geist Mono',monospace}
.tit{font:500 10px 'Geist Mono',monospace;letter-spacing:.16em;fill:var(--te);text-transform:uppercase}
.sub{font:400 10px 'Geist Mono',monospace;fill:#4d5763}
.caja{fill:#121821;stroke:var(--l2)}
.cable{fill:none;stroke:#2c3641;stroke-width:1.2}
.peso{fill:none;stroke-linecap:round;transition:stroke-width .35s,stroke .35s,opacity .35s}
.pulso{fill:none;stroke-linecap:round;stroke-dasharray:3 26;animation:fluye 1.6s linear infinite;transition:stroke-width .35s,stroke .35s}
@keyframes fluye{to{stroke-dashoffset:-58}}
@media(prefers-reduced-motion:reduce){.pulso,.capa{animation:none!important}}
.capa{animation:late 2.4s ease-in-out infinite}
@keyframes late{0%,100%{opacity:.55}50%{opacity:1}}
.nodo{cursor:help}
.nodo circle,.nodo rect{transition:stroke .2s,fill .35s}
.nodo:hover circle,.nodo:hover rect.caja{stroke:var(--r)}
.val{font:500 12px 'Geist Mono',monospace}
.chip rect{fill:#121821;stroke:var(--l2)}
.peldano rect{transition:fill .3s,stroke .3s,opacity .3s}
#tip{position:absolute;z-index:10;pointer-events:none;max-width:290px;padding:10px 12px;background:rgba(10,13,17,.96);border:1px solid var(--l2);
  box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;border-radius:2px;font-size:12px;line-height:1.5;color:var(--t2)}
#tip b{display:block;color:var(--t);font-weight:500;font-size:13px;margin-bottom:3px}
#mandos{position:relative;display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:12px 16px;border-top:1px solid var(--l);background:rgba(11,14,18,.85)}
.grupo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.et{font:500 9.5px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--te)}
button{font:500 10.5px 'Geist Mono',monospace;letter-spacing:.06em;background:transparent;color:var(--t2);border:1px solid var(--l2);padding:6px 10px;border-radius:2px;cursor:pointer}
button:hover{border-color:var(--r);color:var(--t)}
button.on{background:var(--r);border-color:var(--r);color:#0b0e12}
.par{display:flex;align-items:center;gap:3px}.par span{font:500 10.5px 'Geist Mono',monospace;color:var(--t2);margin-right:4px}
.par button{padding:5px 9px}
.deslizadores label{display:flex;align-items:center;gap:7px;font:400 11px 'Geist Mono',monospace;color:var(--t2)}
input[type=range]{width:96px;accent-color:var(--r)}
output{min-width:46px;color:var(--t);font:500 11px 'Geist Mono',monospace}
</style>
<script>
const D=__DATOS__;
const P=D.parametros,PF=D.perfiles,NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg'),tip=document.getElementById('tip'),raiz=document.getElementById('fusion');
const NOMBRE={muy_baja:'Muy baja',baja:'Baja',intermedia:'Intermedia',alta:'Alta',muy_alta:'Muy alta'};
const COLOR={muy_baja:'#4a3027',baja:'#6e3f2c',intermedia:'#8f5135',alta:'#b9663f',muy_alta:'#e09466'};
const ORDEN=['imagen','HR','HER2','edad','log_volumen'];
const ETQ={imagen:'Imagen',HR:'HR',HER2:'HER2',edad:'Edad',log_volumen:'Volumen'};
const fmt=(x,n=2)=>Number(x).toLocaleString('es-ES',{minimumFractionDigits:n,maximumFractionDigits:n});
const sig=z=>1/(1+Math.exp(-z)),logit=p=>Math.log(p/(1-p));
let E={...D.ejemplos[0].valores};

function el(tag,at={},padre=svg,texto){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(texto!==undefined)e.textContent=texto;padre.appendChild(e);return e}
function ayuda(e,titulo,texto){e.classList.add('nodo');e.addEventListener('mousemove',ev=>{const r=raiz.getBoundingClientRect();
  tip.innerHTML=`<b>${titulo}</b>${typeof texto==='function'?texto():texto}`;tip.style.opacity=1;
  let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;if(x+300>r.width)x-=318;tip.style.left=x+'px';tip.style.top=y+'px';});
  e.addEventListener('mouseleave',()=>tip.style.opacity=0);}

// ---------------------------------------------------------------- columnas
const X={ent:20,cnn:200,pimg:400,esc:570,suma:770,sig:852,sal:1088};
const Y={imagen:78,HR:186,HER2:256,edad:326,log_volumen:396};
[['Entradas',X.ent+68,'imagen previa + clínica'],['CNN congelada',X.cnn+80,'5 redes × 4 reflexiones'],
 ['Estandarización',X.esc,'(x − μ) / s'],['Logística',X.suma,'Σ β·x̃ + b'],['Salida',X.sal,'probabilidad y perfil']]
  .forEach(([t,x,s])=>{el('text',{x,y:24,'text-anchor':'middle',class:'tit'},svg,t);el('text',{x,y:38,'text-anchor':'middle',class:'sub'},svg,s)});

// Fases de la resonancia como una pila de cortes.
const pila=el('g');
['PRE','EARLY','LATE'].forEach((f,i)=>{const x=X.ent+i*22,y=54+i*12;
  el('image',{href:D.fases[f],x,y,width:86,height:86,preserveAspectRatio:'xMidYMid slice'},pila);
  el('rect',{x,y,width:86,height:86,fill:'none',stroke:'#3a4552'},pila);
  el('text',{x:x+4,y:y+82,class:'mono','font-size':8,fill:'#ece8df'},pila,f);});
ayuda(pila,'Resonancia DCE previa','PRE, EARLY y LATE del mismo corte, antes de la quimioterapia. Si hay varios cortes, se promedian.');

// CNN: cinco redes como cadenas de bloques que se estrechan.
const cnn=el('g');
for(let r=0;r<5;r++){const y=50+r*14;
  [[0,30],[34,24],[62,18],[84,12],[100,8]].forEach(([dx,h],k)=>el('rect',{x:X.cnn+dx,y:y+(10-h/3),width:k===4?8:28-k*4,height:h/2.2,rx:1,
    fill:['#3a4552','#4d5763','#8f5135','#b9663f','#e09466'][k],class:'capa',style:`animation-delay:${(r*0.18+k*0.12).toFixed(2)}s`},cnn));}
el('text',{x:X.cnn+60,y:140,'text-anchor':'middle',class:'sub'},cnn,'media de redes y cortes');
ayuda(cnn,'CNN de imagen congelada','Las 5 redes RedDCE (una por semilla) puntúan cada corte con 4 reflexiones. Se promedian redes y cortes. Sus pesos no cambian al añadir la clínica.');
el('path',{d:`M${X.ent+132} 110 C${X.cnn-30} 110 ${X.cnn-30} 95 ${X.cnn-4} 95`,class:'cable'});
el('path',{d:`M${X.cnn+112} 95 C${X.pimg-40} 95 ${X.pimg-40} ${Y.imagen} ${X.pimg-26} ${Y.imagen}`,class:'cable'});

// p de imagen (cruda) → logit.
const gp=el('g');el('circle',{cx:X.pimg,cy:Y.imagen,r:25,class:'caja'},gp);
const pTxt=el('text',{x:X.pimg,y:Y.imagen+4,'text-anchor':'middle',class:'val'},gp);
el('text',{x:X.pimg,y:Y.imagen+42,'text-anchor':'middle',class:'sub'},gp,'p cruda → logit');
ayuda(gp,'Puntuación de imagen',()=>`p cruda = ${fmt(E.p,3)} → logit = ${fmt(logit(E.p),3)}. La fusión recibe el logit, sin la calibración de la CNN sola.`);

// Clínica: cuatro fichas.
const fichas={};
[['HR','HR'],['HER2','HER2'],['edad','Edad'],['log_volumen','Volumen']].forEach(([k,t])=>{
  const g=el('g',{class:'chip'});el('rect',{x:X.ent,y:Y[k]-17,width:156,height:34,rx:2},g);
  el('text',{x:X.ent+10,y:Y[k]+4,'font-size':11.5,fill:'#a9afb7'},g,t);
  fichas[k]=el('text',{x:X.ent+146,y:Y[k]+4,'text-anchor':'end',class:'val'},g);
  ayuda(g,t,{HR:'Positivo si el tumor tiene receptores de estrógeno o progesterona. Los HR+ responden menos a la quimioterapia.',
    HER2:'Positivo si sobreexpresa HER2. Los HER2+ alcanzan pCR con más frecuencia.',edad:'Edad al diagnóstico, en años.',
    log_volumen:'Volumen del tumor en la resonancia (cm³). Se transforma con log(1 + volumen) antes de escalarlo.'}[k]);
  el('path',{d:`M${X.ent+156} ${Y[k]} C${X.esc-120} ${Y[k]} ${X.esc-110} ${Y[k]} ${X.esc-24} ${Y[k]}`,class:'cable'});});
el('path',{d:`M${X.pimg+25} ${Y.imagen} L${X.esc-24} ${Y.imagen}`,class:'cable'});

// Estandarización: un nodo por variable.
const esc={};
ORDEN.forEach(k=>{const g=el('g');esc[k]={c:el('circle',{cx:X.esc,cy:Y[k],r:22,class:'caja'},g),t:el('text',{x:X.esc,y:Y[k]+4,'text-anchor':'middle',class:'val'},g)};
  el('text',{x:X.esc,y:Y[k]-28,'text-anchor':'middle',class:'sub'},g,ETQ[k]);
  const i=P.columnas.indexOf(k);
  ayuda(g,`${ETQ[k]} estandarizada`,()=>`x̃ = (x − ${fmt(P.media[i],3)}) / ${fmt(P.escala[i],3)} = <b style="display:inline;color:#c97753">${fmt(est(k),2)}</b>. Media y escala proceden del ajuste final y no se recalculan con la paciente nueva.`);});

// Pesos: grosor = |β·x̃|, color = sentido de la contribución.
const pesos={};
ORDEN.forEach(k=>{const d=`M${X.esc+22} ${Y[k]} C${X.suma-110} ${Y[k]} ${X.suma-100} ${236} ${X.suma-44} ${236}`;
  const base=el('path',{d,class:'peso'}),pulso=el('path',{d,class:'pulso'}),
    eti=el('text',{x:X.esc+60,y:Y[k]-8,class:'mono','font-size':10,fill:'#6b7480'});
  pesos[k]={base,pulso,eti};
  const g=el('g');g.appendChild(base);g.appendChild(pulso);
  ayuda(g,`Peso de ${ETQ[k]}`,()=>`β = ${fmt(P.coeficientes[k],3)} · contribución β·x̃ = ${fmt(P.coeficientes[k]*est(k),3)}. Naranja empuja hacia pCR; azul, en contra. El grosor es la magnitud.`);});

// Suma logística con intercepto.
const gs=el('g');el('circle',{cx:X.suma,cy:236,r:44,class:'caja'},gs);
el('text',{x:X.suma,y:228,'text-anchor':'middle','font-size':22,'font-family':'Instrument Serif'},gs,'Σ');
const zTxt=el('text',{x:X.suma,y:252,'text-anchor':'middle',class:'val'},gs);
el('text',{x:X.suma,y:300,'text-anchor':'middle',class:'sub'},gs,`b = ${fmt(P.intercepto,3)}`);
ayuda(gs,'Regresión logística (L2)',()=>`z = b + Σ β·x̃ = ${fmt(P.intercepto,3)} ${ORDEN.map(k=>{const v=P.coeficientes[k]*est(k);return (v<0?'− ':'+ ')+fmt(Math.abs(v),3)}).join(' ')} = <b style="display:inline;color:#c97753">${fmt(z(),3)}</b>. Cinco coeficientes y un intercepto ajustados con ${P.n_ajuste.toLocaleString('es-ES')} pacientes.`);

// Sigmoide con el punto de la paciente.
const SX=X.sig,SY=186,SW=118,SH=100,zx=v=>SX+SW*(v+4)/8,py=p=>SY+SH-SH*p;
el('path',{d:`M${X.suma+44} 236 L${SX-6} 236`,class:'cable'});
el('rect',{x:SX,y:SY,width:SW,height:SH,fill:'none',stroke:'#1d252f'});
el('path',{d:Array.from({length:41},(_,i)=>{const v=-4+i*0.2;return (i?'L':'M')+zx(v).toFixed(1)+' '+py(sig(v)).toFixed(1)}).join(' '),fill:'none',stroke:'#a9afb7','stroke-width':1.5});
const umbY=py(P.politica.umbral);
el('line',{x1:SX,x2:SX+SW,y1:umbY,y2:umbY,stroke:'#6b7480','stroke-dasharray':'2 3'});
el('text',{x:SX+SW-2,y:umbY-4,'text-anchor':'end',class:'sub'},svg,'umbral');
const punto=el('circle',{r:5,fill:'#c97753',stroke:'#0b0e12','stroke-width':2});
el('text',{x:SX+SW/2,y:SY+SH+16,'text-anchor':'middle',class:'sub'},svg,'σ(z) = 1 / (1 + e^−z)');
const gsig=el('rect',{x:SX,y:SY,width:SW,height:SH,fill:'transparent'});
ayuda(gsig,'Sigmoide','Convierte la suma z en una probabilidad entre 0 y 1. La línea discontinua es el umbral de Youden fijado en desarrollo.');
el('path',{d:`M${SX+SW+6} 236 C${X.sal-70} 236 ${X.sal-70} 120 ${X.sal-54} 120`,class:'cable'});

// Salida: arco con la probabilidad y escalera de perfiles.
const R=46,C=2*Math.PI*R,gsal=el('g');
el('circle',{cx:X.sal,cy:120,r:R,fill:'#0b0f13',stroke:'#2a3440','stroke-width':3},gsal);
const arco=el('circle',{cx:X.sal,cy:120,r:R,fill:'none',stroke:'#c97753','stroke-width':4,'stroke-linecap':'round',transform:`rotate(-90 ${X.sal} 120)`,style:'transition:stroke-dasharray .45s'},gsal);
const pSal=el('text',{x:X.sal,y:128,'text-anchor':'middle','font-size':30,'font-family':'Instrument Serif'},gsal);
el('text',{x:X.sal,y:184,'text-anchor':'middle',class:'sub'},gsal,'probabilidad de pCR');
ayuda(gsal,'Probabilidad de pCR',()=>`${fmt(100*prob(),1)} %. Por encima del umbral ${fmt(P.politica.umbral,3)} se clasificaría como pCR; la lectura recomendada es el perfil.`);
const peldanos=[];
PF.perfiles.slice().reverse().forEach((f,i)=>{const y=212+i*44,g=el('g',{class:'peldano'});
  const r=el('rect',{x:X.sal-62,y,width:124,height:38,rx:2,fill:'#121821',stroke:'#2a3440'},g);
  el('rect',{x:X.sal-62,y,width:4,height:38,fill:COLOR[f.perfil]},g);
  el('text',{x:X.sal-50,y:y+16,class:'mono','font-size':9.5,fill:'#a9afb7'},g,`P${5-i} · ${NOMBRE[f.perfil].toUpperCase()}`);
  el('text',{x:X.sal-50,y:y+31,class:'mono','font-size':11},g,`${fmt(100*f.tasa_pcr,0)} % pCR`);
  el('text',{x:X.sal+56,y:y+31,'text-anchor':'end',class:'mono','font-size':10,fill:'#6b7480'},g,`${fmt(f.razon,1)}×`);
  peldanos.push({perfil:f.perfil,r,g});
  ayuda(g,`Perfil ${NOMBRE[f.perfil].toLowerCase()}`,`Probabilidad ${fmt(f.p_min,2)}–${fmt(f.p_max,2)}. En la validación cruzada: ${f.pcr} pCR de ${f.n} pacientes (${fmt(100*f.tasa_pcr,0)} %), ${fmt(f.razon,1)} veces la media.`);});
peldanos.reverse();

// ---------------------------------------------------------------- cálculo
function bruto(k){return k==='imagen'?logit(E.p):k==='log_volumen'?Math.log1p(E.vol):E[k]}
function est(k){const i=P.columnas.indexOf(k);return (bruto(k)-P.media[i])/P.escala[i]}
function z(){return P.intercepto+ORDEN.reduce((s,k)=>s+P.coeficientes[k]*est(k),0)}
function prob(){return sig(z())}
function perfil(p){let i=0;while(i<PF.cortes.length&&p>=PF.cortes[i])i++;return PF.perfiles[i].perfil}

function pintar(){
  pTxt.textContent=fmt(E.p,2);
  fichas.HR.textContent=E.HR?'positivo':'negativo';fichas.HER2.textContent=E.HER2?'positivo':'negativo';
  fichas.edad.textContent=`${E.edad} años`;fichas.log_volumen.textContent=`${E.vol} cm³`;
  ORDEN.forEach(k=>{const v=est(k),c=P.coeficientes[k]*v,col=c>=0?'#c97753':'#5a9ec4',w=1+Math.min(12,Math.abs(c)*14);
    esc[k].t.textContent=(v>=0?'+':'')+fmt(v,2);esc[k].c.style.fill=`rgba(${c>=0?'201,119,83':'90,158,196'},${Math.min(.45,Math.abs(c)*.6).toFixed(2)})`;
    pesos[k].base.style.stroke=col;pesos[k].base.style.strokeWidth=w;pesos[k].base.style.opacity=.32;
    pesos[k].pulso.style.stroke=col;pesos[k].pulso.style.strokeWidth=Math.max(1.5,w*.55);
    pesos[k].eti.textContent=`β ${fmt(P.coeficientes[k],2)} · ${c>=0?'+':'−'}${fmt(Math.abs(c),2)}`;
    pesos[k].eti.setAttribute('fill',col);});
  const zz=z(),p=sig(zz);zTxt.textContent='z = '+fmt(zz,2);
  punto.setAttribute('cx',zx(Math.max(-4,Math.min(4,zz))));punto.setAttribute('cy',py(p));
  arco.setAttribute('stroke-dasharray',`${(p*C).toFixed(1)} ${C.toFixed(1)}`);pSal.textContent=fmt(100*p,1)+' %';
  const pf=perfil(p);peldanos.forEach(o=>{const on=o.perfil===pf;o.r.setAttribute('stroke',on?'#ece8df':'#2a3440');o.r.setAttribute('fill',on?'#1b232d':'#121821');o.g.style.opacity=on?1:.5;});
  document.getElementById('p').value=E.p;document.getElementById('p_o').textContent=fmt(E.p,3);
  document.getElementById('edad').value=E.edad;document.getElementById('edad_o').textContent=E.edad+' a';
  document.getElementById('vol').value=E.vol;document.getElementById('vol_o').textContent=E.vol+' cm³';
  document.querySelectorAll('.par button').forEach(b=>b.classList.toggle('on',Number(b.dataset.v)===E[b.dataset.k]));
}

const cajaEj=document.getElementById('ejemplos');
D.ejemplos.forEach((ej,i)=>{const b=document.createElement('button');b.textContent=ej.nombre;b.className=i?'':'on';
  b.addEventListener('click',()=>{E={...ej.valores};cajaEj.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));pintar();});cajaEj.appendChild(b);});
const libre=()=>cajaEj.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
[['p',parseFloat],['edad',parseInt],['vol',parseInt]].forEach(([id,f])=>document.getElementById(id).addEventListener('input',ev=>{E[id]=f(ev.target.value);libre();pintar();}));
document.querySelectorAll('.par button').forEach(b=>b.addEventListener('click',()=>{E[b.dataset.k]=Number(b.dataset.v);libre();pintar();}));
pintar();
</script>
